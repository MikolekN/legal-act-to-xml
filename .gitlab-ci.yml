---
workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - when: always

default:
  timeout: "15m"
  retry:
    max: 2
    when:
      - "runner_system_failure"
      - "api_failure"
      - "scheduler_failure"

stages:
  - "test"
  - "quality"
  - "prepare_publish"
  - "build_and_publish"

variables:
  DOTNET_IMAGE: "mcr.microsoft.com/dotnet/sdk:10.0.400"
  PYTHON_IMAGE: "python:3.11.15-trixie"
  SOLUTION: "Saga.sln"
  WEB_PROJECT: "src/Saga.Web/Saga.Web.csproj"
  TEST_PROJECT: "tests/Saga.Core.Tests/Saga.Core.Tests.csproj"
  NUGET_PACKAGES: "${CI_PROJECT_DIR}/.nuget/packages"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

.dotnet:
  image: "${DOTNET_IMAGE}"
  cache:
    key: "nuget"
    paths:
      - ".nuget/packages"

.docker:
  image: "docker:29-cli"
  services:
    - name: "docker:29-dind"
      command:
        - "--registry-mirror"
        - "https://proxy.containers.task.gda.pl"
  tags:
    - "docker"
    - "dind"
  variables:
    DOCKER_TLS_CERTDIR: ""
    BUILDKIT_PROGRESS: "plain"
    CACHE_IMAGE: "${CI_REGISTRY_IMAGE}:build-cache"
  before_script:
    - echo "$CI_JOB_TOKEN" | docker login --username gitlab-ci-token --password-stdin "$CI_REGISTRY"
    - docker buildx create --driver docker-container --use

unit-tests:
  extends: ".dotnet"
  stage: "test"
  interruptible: true
  coverage: '/Total coverage:\s*(\d+(?:\.\d+)?)%/'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  variables:
    COV_FAIL_UNDER: "70"
  before_script:
    - dotnet restore "${SOLUTION}"
  script:
    - |
      dotnet test --project "${TEST_PROJECT}" \
        --configuration Release \
        --no-restore \
        --results-directory TestResults \
        --coverage \
        --coverage-output-format cobertura \
        --coverage-output coverage.xml \
        --report-xunit-junit \
        --report-xunit-junit-filename junit.xml
    - |
      COVERAGE_REPORT="TestResults/coverage.xml"

      if [ ! -s "${COVERAGE_REPORT}" ]; then
        echo "ERROR: raport pokrycia nie powstal albo jest pusty: ${COVERAGE_REPORT}" >&2
        ls -la TestResults >&2 || true
        exit 1
      fi

      awk -v threshold="${COV_FAIL_UNDER}" '
        found { next }
        match($0, /line-rate="[0-9.]+"/) {
          found = 1
          percent = substr($0, RSTART + 11, RLENGTH - 12) * 100
          printf "Total coverage: %.1f%%\n", percent
          if (percent < threshold) {
            printf "ERROR: pokrycie %.1f%% ponizej progu %s%%\n", percent, threshold > "/dev/stderr"
            exit 1
          }
        }
        END {
          if (!found) {
            print "ERROR: w raporcie pokrycia nie ma atrybutu line-rate — nieoczekiwany format." > "/dev/stderr"
            exit 1
          }
        }
      ' "${COVERAGE_REPORT}"
  artifacts:
    when: always
    paths:
      - "TestResults/coverage.xml"
    reports:
      junit: "TestResults/junit.xml"
      coverage_report:
        coverage_format: cobertura
        path: TestResults/coverage.xml

.quality:
  stage: "quality"
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'

.quality-dotnet:
  extends:
    - ".quality"
    - ".dotnet"
  cache:
    key: "nuget"
    paths:
      - ".nuget/packages"
    policy: "pull"
  before_script:
    - dotnet restore "${SOLUTION}"

lint-check:
  extends: ".quality-dotnet"
  script:
    - dotnet format style "${SOLUTION}" --verify-no-changes --no-restore --severity warn

format-check:
  extends: ".quality-dotnet"
  script:
    - dotnet format whitespace "${SOLUTION}" --verify-no-changes --no-restore

type-check:
  extends: ".quality-dotnet"
  script:
    - dotnet build "${SOLUTION}" --configuration Release --no-restore -warnaserror

dependency-check:
  extends: ".quality-dotnet"
  script:
    - |
      dotnet list "${SOLUTION}" package --vulnerable --include-transitive | tee vulnerable.txt

      if grep -q "has the following vulnerable packages" vulnerable.txt; then
        echo "ERROR: zaleznosci zawieraja pakiety z podatnosciami" >&2
        exit 1
      fi

deprecation-check:
  extends: ".quality-dotnet"
  script:
    - |
      dotnet list "${SOLUTION}" package --deprecated | tee deprecated.txt

      if grep -q "has the following deprecated packages" deprecated.txt; then
        echo "ERROR: zaleznosci zawieraja pakiety wycofane" >&2
        exit 1
      fi

version-check:
  image: "${DOTNET_IMAGE}"
  stage: "prepare_publish"
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ] && ! printf '%s' "$CI_COMMIT_TAG" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(\.dev[0-9]+)?$'; then
        echo "ERROR: tag '${CI_COMMIT_TAG}' nie jest tagiem wydania." >&2
        echo "       Oczekiwany format: X.Y.Z albo X.Y.Z.devN," >&2
        echo "       Tag musi byc rowny <Version> z Directory.Build.props." >&2
        exit 1
      fi

      PUBLISH_VERSION="$(dotnet msbuild "${WEB_PROJECT}" -getProperty:Version --nologo -v:q | tr -d '[:space:]')"

      if [ -z "$PUBLISH_VERSION" ]; then
        echo "ERROR: nie udalo sie odczytac wersji z Directory.Build.props" >&2
        exit 1
      fi

      if [ -n "${CI_COMMIT_TAG:-}" ] && [ "$CI_COMMIT_TAG" != "$PUBLISH_VERSION" ]; then
        echo "ERROR: Tag ${CI_COMMIT_TAG} nie zgadza sie z wersja projektu ${PUBLISH_VERSION}" >&2
        exit 1
      fi

      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        case "$PUBLISH_VERSION" in
          *.dev*) ;;
          *) PUBLISH_VERSION="${PUBLISH_VERSION}.dev${CI_PIPELINE_IID}" ;;
        esac
      fi

      printf 'PUBLISH_VERSION=%s\n' "$PUBLISH_VERSION" > version.env
  artifacts:
    reports:
      dotenv: version.env

.publish:
  stage: "build_and_publish"
  when: manual
  needs:
    - job: "version-check"
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

diff-coverage:
  stage: "test"
  image: "${PYTHON_IMAGE}"
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  needs:
    - job: "unit-tests"
      artifacts: true
  variables:
    DIFF_FAIL_UNDER: "80"
  script:
    - pip3 install --no-cache-dir "diff-cover==9.6.0"
    - git fetch --no-tags --depth=1 origin "${CI_MERGE_REQUEST_DIFF_BASE_SHA}"
    - |
      diff-cover TestResults/coverage.xml \
        --fail-under="${DIFF_FAIL_UNDER}" \
        --compare-branch="${CI_MERGE_REQUEST_DIFF_BASE_SHA}" | tee diff-cover.log
    - |
      COVERED_PROJECTS="$(grep -o '<package[^>]*name="[^"]*"' TestResults/coverage.xml \
        | sed 's/.*name="//; s/"$//' | sort -u)"

      if [ -z "${COVERED_PROJECTS}" ]; then
        echo "ERROR: raport pokrycia nie ma ani jednego <package> - jest pusty albo ma" >&2
        echo "       nieoczekiwany format." >&2
        exit 1
      fi

      CHANGED_CS=0
      SKIPPED_PROJECTS=""

      for FILE in $(git diff --name-only "${CI_MERGE_REQUEST_DIFF_BASE_SHA}" HEAD -- src | grep '\.cs$'); do
        PROJECT="$(echo "${FILE}" | cut -d '/' -f 2)"

        if echo "${COVERED_PROJECTS}" | grep -qx "${PROJECT}"; then
          CHANGED_CS=$((CHANGED_CS + 1))
        else
          case " ${SKIPPED_PROJECTS} " in
            *" ${PROJECT} "*) ;;
            *) SKIPPED_PROJECTS="${SKIPPED_PROJECTS} ${PROJECT}" ;;
          esac
        fi
      done

      if [ -n "${SKIPPED_PROJECTS}" ]; then
        echo "UWAGA: projekty poza raportem pokrycia (zaden test ich nie laduje):${SKIPPED_PROJECTS}"
        echo "       Zmiany w nich nie podlegaja progowi roznicowemu - patrz docs/backlog.md."
      fi

      if [ "${CHANGED_CS}" -gt 0 ] && grep -q "No lines with coverage information" diff-cover.log; then
        echo "ERROR: diff zmienia ${CHANGED_CS} plik(ow) .cs w projektach objetych pokryciem," >&2
        echo "       a diff-cover nie dopasowal ani jednej linii - prog pokrycia roznicowego" >&2
        echo "       nie zostal sprawdzony. Sprawdz, czy raport pokrycia powstal przy tej" >&2
        echo "       samej sciezce checkoutu." >&2
        exit 1
      fi

container-build-and-publish:
  extends:
    - ".publish"
    - ".docker"
  script:
    - |
      IMAGE="${CI_REGISTRY_IMAGE}:${PUBLISH_VERSION}"

      if docker buildx imagetools inspect "${IMAGE}" > previous-image.txt 2>/dev/null; then
        echo "=================================================================="
        echo "UWAGA: tag ${PUBLISH_VERSION} juz istnieje w rejestrze i zostanie nadpisany."
        grep -E '^(Name|Digest):' previous-image.txt || cat previous-image.txt
        echo "Powyzszy digest wskazuje obraz, ktory zaraz przestanie byc pod tym tagiem."
        echo "=================================================================="
      fi

      set -- --tag "${IMAGE}"

      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        set -- "$@" --tag "${CI_REGISTRY_IMAGE}:latest"
      fi

      docker buildx build \
        --cache-from "type=registry,ref=${CACHE_IMAGE}" \
        --cache-to "type=registry,ref=${CACHE_IMAGE},mode=max" \
        --build-arg "VERSION=${PUBLISH_VERSION}" \
        --build-arg "REVISION=${CI_COMMIT_SHORT_SHA}" \
        "$@" \
        --push .
