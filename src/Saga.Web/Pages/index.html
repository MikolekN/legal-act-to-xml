<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{service_name}}</title>
    <link rel="icon" href="/caise.png" type="image/png">

    <style>
        body {
            margin: 0;
            box-sizing: border-box;
            min-height: 100vh;
            padding: 80px 20px;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .card {
            box-sizing: border-box;
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .15);
            padding: 40px;
            text-align: center;
        }

        .logo img {
            max-width: 120px;
            margin-bottom: 20px;
        }

        h1 {
            color: #013765;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin-bottom: 30px;
        }

        .button {
            display: inline-block;
            background: #65BE57;
            color: white;
            padding: 14px 30px;
            text-decoration: none;
            border-radius: 8px;
            font-size: 18px;
        }

        .button:hover {
            background: #56a74b;
        }

        .button:focus-visible {
            outline: 3px solid #013765;
            outline-offset: 2px;
        }

        .version {
            margin-top: -5px;
            margin-bottom: 15px;
            color: gray;
            font-size: 13px;
        }

        .footer {
            margin-top: 30px;
            color: gray;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="logo">
            <img src="/caise.png" alt="CAISE">
        </div>

        <h1>SAGA</h1>
        <p><b>S</b>ystem <b>A</b>utomatycznego <b>G</b>enerowania <b>A</b>któw</p>
        <div class="version">wersja {{version}}</div>

        <a class="button" href="{{docs_path}}">
            Dokumentacja API
        </a>

        <div class="footer">
            CAISE • NLP • LEX Services
        </div>

    </div>

</body>

</html>
